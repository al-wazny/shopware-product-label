name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: PHP Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Install root dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install plugin dependencies
        working-directory: custom/plugins/UggProductLabel
        run: composer install --prefer-dist --no-interaction --no-progress --no-lock

      - name: PHPStan
        working-directory: custom/plugins/UggProductLabel
        run: vendor/bin/phpstan analyse --level=max

      - name: PHP CS Fixer
        working-directory: custom/plugins/UggProductLabel
        run: vendor/bin/php-cs-fixer check --diff --verbose

      - name: PHPUnit
        working-directory: custom/plugins/UggProductLabel
        run: vendor/bin/phpunit

  shopware:
    name: Shopware Plugin Installation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: shopware
          MARIADB_USER: shopware
          MARIADB_PASSWORD: shopware
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, zip, gd, curl, bcmath
          coverage: none
          tools: composer:v2

      - name: Allow Symfony runtime plugin
        run: composer config --no-plugins allow-plugins.symfony/runtime true

      - name: Install Shopware dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Refresh plugins
        run: bin/console plugin:refresh

      - name: Install Shopware
        env:
          DATABASE_URL: mysql://shopware:shopware@127.0.0.1:3306/shopware
        run: |
          bin/console system:install \
            --basic-setup \
            --create-database \
            --no-interaction

      - name: Install and activate plugin
        run: |
          bin/console plugin:refresh
          bin/console plugin:install --activate UggProductLabel

      - name: Verify plugin is active
        run: |
          bin/console plugin:list | grep UggProductLabel 

